<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Toca da Truta – Avaliação de Atendimento</title>
<style>
:root{--bg:#f6f1e6;--card:#fff;--tx:#1d2b25;--mut:#66766e;--pri:#1f5c4a;--acc:#d9822b;--bd:#e2dac7;--bad:#b3392f}
@media(prefers-color-scheme:dark){:root{--bg:#14201b;--card:#1e2d26;--tx:#eee9dc;--mut:#9fb0a7;--pri:#4fb08f;--acc:#f0a24f;--bd:#34473e;--bad:#ef7f74}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
#app{max-width:980px;margin:0 auto;padding:16px}
h1{font:700 22px Georgia,serif;margin:4px 0 2px}h2{font:700 17px Georgia,serif;margin:18px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
.mut{color:var(--mut);font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
button,select,input,textarea{font:inherit;color:var(--tx);background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:9px 12px}
button{cursor:pointer;background:var(--pri);color:#fff;border:0;font-weight:600}button.g{background:none;color:var(--pri);border:1px solid var(--pri)}button.d{background:var(--bad)}button:disabled{opacity:.5}
.big{width:100%;padding:18px;font-size:18px;margin:6px 0;border-radius:14px}
.stars{display:flex;justify-content:center;gap:6px;margin:20px 0}.stars button{background:none;font-size:42px;color:var(--bd);padding:2px 6px}.stars button.on{color:var(--acc)}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:10px 0}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--pri);color:#fff}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}.kp .card{margin:0}.kp b{font-size:24px;display:block}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:7px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}
.tag{padding:2px 8px;border-radius:9px;background:var(--bd);font-size:12px}.center{text-align:center}
</style></head><body><div id="app"><p class="mut">Carregando…</p></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-auth.js";
import {getFirestore,collection,doc,getDoc,getDocs,setDoc,updateDoc,deleteDoc,onSnapshot,writeBatch,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-firestore.js";
const fb=initializeApp({apiKey:"AIzaSyBEUDHiqEtimOwURbB5wbuJWfLV3n3gA_A",authDomain:"avaliacaogarcom-f6655.firebaseapp.com",projectId:"avaliacaogarcom-f6655",storageBucket:"avaliacaogarcom-f6655.firebasestorage.app",messagingSenderId:"93174867583",appId:"1:93174867583:web:d2de1173c3addeaf12c14a"});
const db=getFirestore(fb),auth=getAuth(fb);
const $=s=>document.querySelector(s),app=$('#app'),W=window;
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>crypto.randomUUID(),D=(c,i)=>doc(db,c,i);
const QS=["Simpatia e cordialidade do garçom","Atenção e disponibilidade durante o atendimento","Agilidade do atendimento","Conhecimento sobre o cardápio","Avaliação geral do atendimento"];
const MSG="Obrigado por compartilhar sua experiência com a gente! Sua opinião é muito importante para a Toca da Truta. Esperamos receber você novamente!";
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0,f1=n=>n.toFixed(2).replace('.',',');
const shell=(t,b)=>app.innerHTML=`<div class="center"><h1>🐟 Toca da Truta</h1><div class="mut">${t}</div></div>${b}`;
const msg=(t,b)=>shell('Avaliação de atendimento',`<div class="card center"><h2>${t}</h2><p>${b}</p></div>`);
W.addEventListener('unhandledrejection',e=>{const c=e.reason?.code||e.reason?.message||'';alert(c.includes('permission')?'SEM PERMISSÃO no Firestore. As regras do banco não estão liberando este e-mail (veja o passo das regras).':'Erro: '+c)});
const mesa=new URLSearchParams(location.search).get('mesa');
mesa?client(mesa):startAdmin();

/* ---------- CLIENTE ---------- */
const C=W.C={};
async function client(tid){
  shell('Avaliação de atendimento','<p class="center mut">Carregando…</p>');
  try{
    const t=await getDoc(D('tables',tid));
    if(!t.exists())return msg('Mesa não encontrada','Este link não corresponde a uma mesa cadastrada.');
    const sid=t.data().activeSession,x=sid&&await getDoc(D('sessions',sid));
    if(!x||!x.exists()||x.data().status==='encerrada')return msg('Atendimento não iniciado','Peça à nossa equipe para liberar a avaliação da sua mesa.');
    if(x.data().status==='avaliada')return msg('Avaliação já enviada','Esta mesa já foi avaliada. Muito obrigado! 💚');
    const st=await getDocs(query(collection(db,'staff'),where('status','==','ativo')));
    Object.assign(C,{s:{id:sid,...x.data()},t:t.data(),tid,staff:st.docs.map(d=>({id:d.id,...d.data()})),w:null,r:[],c:'',i:0,busy:0});rc();
  }catch(e){msg('Ops!','Não foi possível carregar. Tente novamente.')}
}
function rc(){
  const n=QS.length+2,i=C.i;let b='';
  if(i===0)b=`<h2 class="center">Quem realizou seu atendimento?</h2>`+(C.staff.map(w=>`<button class="big" onclick="pick('${w.id}')">${esc(w.name)}</button>`).join('')||'<p class="center mut">Nenhum garçom disponível.</p>');
  else if(i<=QS.length)b=`<h2 class="center">${QS[i-1]}</h2><div class="stars">${[1,2,3,4,5].map(k=>`<button class="${C.r[i-1]>=k?'on':''}" aria-label="${k} estrelas" onclick="star(${k})">★</button>`).join('')}</div><button class="g" onclick="back()">Voltar</button>`;
  else b=`<h2 class="center">Gostaria de deixar algum elogio, sugestão ou comentário? <span class="mut">(opcional)</span></h2><textarea id="cm" rows="4" maxlength="500" style="width:100%" oninput="C.c=this.value">${esc(C.c)}</textarea><button class="big" id="sb" onclick="send()">Enviar avaliação</button><button class="g" onclick="back()">Voltar</button>`;
  shell(`${esc(C.t.name)} · passo ${i+1} de ${n}`,`<div class="bar"><i style="width:${(i+1)/n*100}%"></i></div><div class="card">${b}</div>`);
}
W.pick=id=>{C.w=C.staff.find(w=>w.id===id);C.i=1;rc()};
W.star=k=>{C.r[C.i-1]=k;C.i++;rc()};
W.back=()=>{C.i--;rc()};
W.send=async()=>{
  if(C.busy)return;C.busy=1;$('#sb').disabled=true;
  try{
    const sid=C.s.id,env=C.s.mode||'prod',b=writeBatch(db);
    b.set(D('ratings',sid),{sid,tableId:C.tid,tableName:C.t.name,waiterId:C.w.id,waiterName:C.w.name,scores:C.r,avg:avg(C.r),comment:C.c.trim().slice(0,500),qs:QS,qv:'v1',env,
      status:env==='teste'?'teste':(C.w.id!==C.s.waiterId?'analise':'valida'),at:serverTimestamp()});
    b.update(D('sessions',sid),{status:'avaliada'});
    await b.commit();
    shell('Avaliação enviada',`<div class="card center"><div style="font-size:48px">💚</div><p>${MSG}</p></div>`);
  }catch(e){C.busy=0;e.code==='permission-denied'?msg('Avaliação já enviada','Esta sessão já foi avaliada ou foi encerrada. Obrigado! 💚'):msg('Ops!','Não foi possível enviar. Tente novamente.')}
};

/* ---------- ADMIN ---------- */
const S={staff:[],tables:[],sessions:[],ratings:[],audit:[],awards:[],cfg:{min:5,test:false}},P={tab:'painel',per:'mes',d1:'',d2:'',envV:'prod',fSt:'',fW:''};
let subs=[],perm=true,ME='';
W.G=(k,v)=>{P[k]=v;draw()};
function startAdmin(){onAuthStateChanged(auth,u=>{subs.forEach(f=>f());subs=[];if(!u){ME='';return loginView()}
  ME=u.email;perm=true;
  ['staff','tables','sessions','ratings','audit','awards'].forEach(c=>subs.push(onSnapshot(collection(db,c),sn=>{perm=true;S[c]=sn.docs.map(d=>{const o={id:d.id,...d.data()};if(o.at?.toMillis)o.at=o.at.toMillis();return o});draw()},()=>{perm=false;draw()})));
  subs.push(onSnapshot(D('config','main'),sn=>{if(sn.exists())S.cfg={...S.cfg,...sn.data()};draw()},()=>{}));draw()})}
function loginView(){shell('Painel da gerência',`<div class="card"><h2>Entrar</h2><div class="row"><input id="em" type="email" placeholder="E-mail" autocomplete="username"><input id="pw" type="password" placeholder="Senha" autocomplete="current-password"><button onclick="login()">Entrar</button></div><p id="er" class="mut"></p></div>`)}
W.login=()=>signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(e=>$('#er').textContent='Não entrou ('+(e.code||'erro')+'). Confira se o usuário existe no Firebase > Authentication e se E-mail/Senha está ativado.');
W.logout=()=>signOut(auth);
const log=(a,d)=>setDoc(D('audit',uid()),{at:Date.now(),by:ME,action:a,detail:String(d)});
const fmt=t=>new Date(t).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'});
function range(){
  const n=new Date(),D1=864e5,d0=+new Date(n.getFullYear(),n.getMonth(),n.getDate()),M=(y,m)=>+new Date(y,m,1);
  return({hoje:[d0,d0+D1],ontem:[d0-D1,d0],semana:[d0-6*D1,d0+D1],mes:[M(n.getFullYear(),n.getMonth()),d0+D1],mesant:[M(n.getFullYear(),n.getMonth()-1),M(n.getFullYear(),n.getMonth())],ano:[M(n.getFullYear(),0),d0+D1],anoant:[M(n.getFullYear()-1,0),M(n.getFullYear(),0)],custom:[P.d1?+new Date(P.d1+'T00:00'):0,P.d2?+new Date(P.d2+'T23:59:59'):9e15]})[P.per];
}
const inEnv=r=>(r.env||'prod')===P.envV;
function rank(){
  const [a,b]=range(),v=S.ratings.filter(r=>inEnv(r)&&r.status==='valida'&&r.at>=a&&r.at<b),m=+S.cfg.min,C0=avg(v.map(r=>r.avg));
  return{v,C0,list:S.staff.map(w=>{const x=v.filter(r=>r.waiterId===w.id),n=x.length,m1=avg(x.map(r=>r.avg));return{w,n,m1,sc:n?(n*m1+m*C0)/(n+m):0,ok:n>=m}}).filter(o=>o.n||o.w.status==='ativo').sort((p,q)=>q.ok-p.ok||q.sc-p.sc)};
}
function draw(){
  if(!ME)return;const ae=document.activeElement;
  if(ae&&/INPUT|TEXTAREA|SELECT/.test(ae.tagName)&&ae.id!=='per'&&ae.id!=='nw'&&ae.id!=='nt')return;
  const T=[['painel','Painel'],['garcons','Garçons'],['mesas','Mesas'],['avals','Avaliações'],['premios','Premiação'],['ajustes','Ajustes']];
  if(!perm)return shell('Painel da gerência',`<div class="card center"><h2>Sem permissão</h2><p>O e-mail ${esc(ME)} não é o administrador definido nas regras do Firestore.</p><button onclick="logout()">Sair</button></div>`);
  shell(`${esc(ME)} · <a href="#" onclick="logout();return false">sair</a>`+(S.cfg.test?' · <b style="color:var(--bad)">MODO DE TESTES</b>':''),`<div class="tabs">${T.map(t=>`<button class="${P.tab===t[0]?'on':''}" onclick="G('tab','${t[0]}')">${t[1]}</button>`).join('')}</div>`+({painel:vPainel,garcons:vGar,mesas:vMesas,avals:vAv,premios:vPrem,ajustes:vAj})[P.tab]());
}
const envSel=()=>`<select onchange="G('envV',this.value)"><option value="prod" ${P.envV==='prod'?'selected':''}>Dados reais</option><option value="teste" ${P.envV==='teste'?'selected':''}>Dados de teste</option></select>`;
function vPainel(){
  const R=rank(),all=S.ratings.filter(inEnv),hoje=all.filter(r=>r.status==='valida'&&r.at>=+new Date().setHours(0,0,0,0)).length,top=R.list.find(o=>o.ok);
  const PE=[['hoje','Hoje'],['ontem','Ontem'],['semana','Últimos 7 dias'],['mes','Este mês'],['mesant','Mês anterior'],['ano','Este ano'],['anoant','Ano anterior'],['custom','Personalizado']];
  return`<div class="row"><select id="per" onchange="G('per',this.value)">${PE.map(p=>`<option value="${p[0]}" ${P.per===p[0]?'selected':''}>${p[1]}</option>`).join('')}</select>${P.per==='custom'?`<input type="date" value="${P.d1}" onchange="G('d1',this.value)"><input type="date" value="${P.d2}" onchange="G('d2',this.value)">`:''}${envSel()}</div>
  <div class="kp" style="margin-top:10px"><div class="card"><b>${R.v.length}</b>válidas no período</div><div class="card"><b>${f1(R.C0)}</b>média geral ★</div><div class="card"><b>${hoje}</b>avaliações hoje</div><div class="card"><b>${all.filter(r=>r.status==='analise').length}</b>em análise</div><div class="card"><b>${all.filter(r=>r.status==='desconsiderada').length}</b>desconsideradas</div><div class="card"><b>${top?esc(top.w.name):'—'}</b>${top?'destaque':'sem amostra mínima'}</div></div>
  <h2>Ranking de garçons</h2><div class="card w"><table><tr><th>#</th><th>Garçom</th><th>Média real</th><th>Pontuação</th><th>Avaliações</th><th></th></tr>${R.list.map((o,i)=>`<tr><td>${o.ok?i+1:'–'}</td><td>${esc(o.w.name)}${o.w.status!=='ativo'?' <span class="tag">'+o.w.status+'</span>':''}</td><td>${o.n?f1(o.m1)+' ★':'—'}</td><td><div class="bar" style="width:90px"><i style="width:${o.sc/5*100}%"></i></div>${f1(o.sc)}</td><td>${o.n}</td><td>${o.ok?'':'<span class="tag">provisório (mín. '+S.cfg.min+')</span>'}</td></tr>`).join('')}</table></div>
  <p class="mut">Pontuação = (n·média + m·média geral) ÷ (n + m), com n = avaliações válidas do garçom e m = mínimo configurado. Poucas avaliações aproximam o garçom da média geral, evitando que uma única nota 5 vença; quem tem menos de m fica "provisório" e não é declarado vencedor. Só entram avaliações válidas.</p>`;
}
function vGar(){
  return`<div class="card row"><input id="nw" placeholder="Nome do novo garçom"><button onclick="addW()">Cadastrar</button></div><div class="card w"><table><tr><th>Nome</th><th>Status</th><th>Válidas</th><th></th></tr>${S.staff.map(w=>`<tr><td><input value="${esc(w.name)}" onchange="ren('${w.id}',this.value)"></td><td>${w.status}</td><td>${S.ratings.filter(r=>r.waiterId===w.id&&r.status==='valida'&&inEnv(r)).length}</td><td class="row">${['ativo','inativo','arquivado'].filter(s=>s!==w.status).map(s=>`<button class="g" onclick="stW('${w.id}','${s}')">${s}</button>`).join('')}</td></tr>`).join('')}</table></div><p class="mut">Garçons inativos ou arquivados somem das novas avaliações, mas o histórico permanece.</p>`;
}
W.addW=async()=>{const n=$('#nw').value.trim();if(!n)return;await setDoc(D('staff',uid()),{name:n,status:'ativo',created:Date.now()});$('#nw').value='';document.activeElement.blur();log('garçom criado',n)};
W.ren=(id,n)=>{updateDoc(D('staff',id),{name:n});log('garçom renomeado',n)};
W.stW=(id,s)=>{updateDoc(D('staff',id),{status:s});log('garçom '+s,id)};
function vMesas(){
  const base=location.origin+location.pathname,ativos=S.staff.filter(w=>w.status==='ativo');
  return`<div class="card row"><input id="nt" placeholder="Nome da mesa (ex.: Mesa 01)"><button onclick="addT()">Cadastrar mesa</button></div>
  <div class="card w"><table><tr><th>Mesa</th><th>Link do NFC</th><th>Sessão ativa</th><th></th></tr>${S.tables.map(t=>{const s=S.sessions.find(x=>x.id===t.activeSession&&x.status==='ativa');
  return`<tr><td>${esc(t.name)}</td><td><input readonly value="${base}?mesa=${t.id}" onfocus="this.select()" style="width:260px"></td><td>${s?esc(s.waiterName)+(s.mode==='teste'?' (teste)':''):'—'}</td><td class="row">${s?`<button class="d" onclick="endS('${s.id}','${t.id}')">Encerrar</button>`:`<select id="sw${t.id}">${ativos.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><button onclick="startS('${t.id}')">Iniciar sessão</button>`}</td></tr>`}).join('')}</table></div>
  <p class="mut">NFC Tools: Escrever → Adicionar registro → URL/URI → cole o link da mesa → Escrever. A etiqueta nunca muda; a sessão ativa fica no banco. Novas sessões herdam o modo atual (${S.cfg.test?'TESTE':'real'}).</p>`;
}
W.addT=async()=>{const n=$('#nt').value.trim();if(!n)return;const id=n.toLowerCase().normalize('NFD').replace(/[^a-z0-9]+/g,'').slice(0,20)||uid().slice(0,6);await setDoc(D('tables',id),{name:n,active:true,activeSession:''});$('#nt').value='';document.activeElement.blur();log('mesa criada',n)};
W.startS=async tid=>{const w=S.staff.find(x=>x.id===$('#sw'+tid).value);if(!w)return;const sid=uid(),b=writeBatch(db);
  b.set(D('sessions',sid),{tableId:tid,waiterId:w.id,waiterName:w.name,status:'ativa',mode:S.cfg.test?'teste':'prod',started:Date.now()});b.update(D('tables',tid),{activeSession:sid});await b.commit();log('sessão iniciada',tid)};
W.endS=async(sid,tid)=>{const b=writeBatch(db);b.update(D('sessions',sid),{status:'encerrada',ended:Date.now()});b.update(D('tables',tid),{activeSession:''});await b.commit();log('sessão encerrada',tid)};
function vAv(){
  const L=S.ratings.filter(inEnv).filter(r=>(!P.fSt||r.status===P.fSt)&&(!P.fW||r.waiterId===P.fW)).sort((a,b)=>b.at-a.at),N={valida:'Válida',analise:'Em análise',desconsiderada:'Desconsiderada',teste:'Teste'};
  return`<div class="row">${envSel()}<select onchange="G('fSt',this.value)"><option value="">Todos os status</option>${Object.entries(N).map(e=>`<option value="${e[0]}" ${P.fSt===e[0]?'selected':''}>${e[1]}</option>`).join('')}</select><select onchange="G('fW',this.value)"><option value="">Todos os garçons</option>${S.staff.map(w=>`<option value="${w.id}" ${P.fW===w.id?'selected':''}>${esc(w.name)}</option>`).join('')}</select><input id="mot" placeholder="Motivo (para desconsiderar)"><button class="g" onclick="csv()">Exportar CSV</button></div>
  <div class="card w"><table><tr><th>Data</th><th>Mesa</th><th>Garçom</th><th>Notas</th><th>Média</th><th>Comentário</th><th>Status</th><th></th></tr>${L.map(r=>`<tr><td>${fmt(r.at)}</td><td>${esc(r.tableName)}</td><td>${esc(r.waiterName)}</td><td>${r.scores.join(' · ')}</td><td>${f1(r.avg)}</td><td style="white-space:normal;max-width:240px">${esc(r.comment)}${r.reason?`<br><span class="mut">Motivo: ${esc(r.reason)} (${esc(r.by)}, ${fmt(r.chAt)})</span>`:''}</td><td><span class="tag">${N[r.status]}</span></td><td class="row">${r.status==='desconsiderada'||r.status==='analise'?`<button class="g" onclick="setR('${r.id}','valida')">Validar</button>`:''}${r.status!=='desconsiderada'&&r.status!=='teste'?`<button class="d" onclick="setR('${r.id}','desconsiderada')">Desconsiderar</button>`:''}${r.status==='valida'?`<button class="g" onclick="setR('${r.id}','analise')">Analisar</button>`:''}</td></tr>`).join('')||'<tr><td>Nenhuma avaliação.</td></tr>'}</table></div><p class="mut">Avaliações em análise (garçom escolhido diferente do responsável pela sessão) ficam fora do ranking até serem validadas. Nada é apagado: a desconsideração é lógica e auditada.</p>`;
}
W.setR=async(id,st)=>{const m=($('#mot')?.value||'').trim();if(st!=='valida'&&!m)return alert('Informe o motivo no campo acima da tabela.');
  await updateDoc(D('ratings',id),{status:st,reason:st==='valida'?'':m,by:ME,chAt:Date.now()});log('avaliação → '+st,id+(m?': '+m:''))};
W.csv=()=>{
  const rows=[['Data','Mesa','Garçom',...QS,'Média','Comentário','Status','Motivo']].concat(S.ratings.filter(inEnv).map(r=>[fmt(r.at),r.tableName,r.waiterName,...r.scores,f1(r.avg),r.comment,r.status,r.reason||'']));
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\n')],{type:'text/csv'}));a.download='avaliacoes.csv';a.click();log('exportação CSV',P.envV);
};
function vPrem(){
  const R=rank();
  return`<div class="card"><b>Destaques do período selecionado no painel</b>${R.list.filter(o=>o.ok).slice(0,3).map((o,i)=>`<div>${i+1}º ${esc(o.w.name)} – pontuação ${f1(o.sc)} (${o.n} avaliações)</div>`).join('')||'<div class="mut">Nenhum garçom atingiu o mínimo de avaliações.</div>'}</div>
  <div class="card row"><input id="ap" placeholder="Período (ex.: Out/2026)"><select id="aw">${S.staff.map(w=>`<option value="${w.id}">${esc(w.name)}</option>`).join('')}</select><input id="an" placeholder="Prêmio / observação"><button onclick="addA()">Registrar premiação</button></div>
  <div class="card w"><table><tr><th>Período</th><th>Garçom</th><th>Prêmio</th><th>Registrado</th></tr>${[...S.awards].sort((a,b)=>b.at-a.at).map(a=>`<tr><td>${esc(a.period)}</td><td>${esc(a.name)}</td><td>${esc(a.note)}</td><td>${fmt(a.at)} · ${esc(a.by)}</td></tr>`).join('')}</table></div><p class="mut">O sistema só aponta destaques; a decisão e qualquer pagamento são sempre manuais.</p>`;
}
W.addA=async()=>{const w=S.staff.find(x=>x.id===$('#aw').value);if(!w||!$('#ap').value)return;await setDoc(D('awards',uid()),{period:$('#ap').value,name:w.name,waiterId:w.id,note:$('#an').value,at:Date.now(),by:ME});log('premiação registrada',w.name)};
function vAj(){
  return`<div class="card"><h2>Configurações</h2><div class="row"><label>Mínimo de avaliações para o ranking <input type="number" min="1" id="mn" value="${S.cfg.min}" style="width:80px"></label><button onclick="svC()">Salvar</button></div>
  <div class="row" style="margin-top:10px"><button class="${S.cfg.test?'d':'g'}" onclick="tgT()">${S.cfg.test?'Desligar modo de testes':'Ligar modo de testes'}</button><button class="d" onclick="clrT()">Apagar dados de teste</button></div>
  <p class="mut">No modo de testes, novas sessões geram avaliações de teste, nunca contadas no ranking real. Apagar testes remove somente registros de teste.</p></div>
  <h2>Auditoria</h2><div class="card w"><table><tr><th>Quando</th><th>Quem</th><th>Ação</th><th>Detalhe</th></tr>${[...S.audit].sort((a,b)=>b.at-a.at).slice(0,60).map(a=>`<tr><td>${fmt(a.at)}</td><td>${esc(a.by)}</td><td>${esc(a.action)}</td><td style="white-space:normal">${esc(a.detail)}</td></tr>`).join('')}</table></div>`;
}
W.svC=()=>{setDoc(D('config','main'),{...S.cfg,min:Math.max(1,+$('#mn').value||5)});log('configuração','mínimo '+$('#mn').value)};
W.tgT=()=>{setDoc(D('config','main'),{...S.cfg,test:!S.cfg.test});log('modo de testes',!S.cfg.test)};
W.clrT=async()=>{const t=S.ratings.filter(r=>r.env==='teste');if(!t.length||!confirm('Apagar '+t.length+' avaliações de teste?'))return;for(const r of t)await deleteDoc(D('ratings',r.id));log('dados de teste apagados',t.length+' registros')};
</script></body></html>
